name: Update README Structure

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.gitmodules'
      - 'docs/**'
      - '*'
      - '*/'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate project structure
        id: structure
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import re

          # 读取映射文件
          with open('docs/dir-mappings.json', 'r', encoding='utf-8') as f:
              mappings = json.load(f)

          root_map = mappings.get('root', {})
          packages_map = mappings.get('packages', {})
          chinese_map = mappings.get('破限工具', {})

          # 扫描 packages 下的子模块
          submodule_cats = set()
          if os.path.exists('.gitmodules'):
              with open('.gitmodules', 'r', encoding='utf-8') as f:
                  for line in f:
                      if 'path = packages/' in line:
                          parts = line.strip().split('path = packages/')
                          if len(parts) > 1:
                              cat = parts[1].split('/')[0]
                              submodule_cats.add(cat)

          # 生成根目录结构行
          root_dirs = []
          for d in sorted(os.listdir('.')):
              if os.path.isdir(d) and not d.startswith('.') and d not in ('node_modules', 'packages'):
                  info = root_map.get(d, {})
                  emoji = info.get('emoji', '📂')
                  desc = info.get('desc', '')
                  root_dirs.append((d, emoji, desc))

          # 生成 packages 结构行
          packages_lines = []
          pkg_cats = ['openai', 'claude', 'gemini', 'codex', 'cursor', 'grok', 'nvidia', 'email', 'general']
          for cat in pkg_cats:
              if cat in submodule_cats or os.path.exists(f'packages/{cat}'):
                  info = packages_map.get(cat, {})
                  emoji = info.get('emoji', '📂')
                  label = cat
                  packages_lines.append((emoji, label, True))  # True = not last

          # 中文目录（破限工具）
          chinese_dir = 'packages/破限工具'
          if os.path.exists(chinese_dir):
              items = []
              if os.path.exists(chinese_dir):
                  for subd in os.listdir(chinese_dir):
                      subpath = os.path.join(chinese_dir, subd)
                      if os.path.isdir(subpath):
                          info = chinese_map.get(subd, {})
                          desc = info.get('desc', subd)
                          items.append((subd, desc))
              packages_lines.append(('🛠️', '破限工具', False, items))  # False = is last

          # 输出 GitHub Actions 输出
          with open('structure_output.txt', 'w', encoding='utf-8') as f:
              # 根目录
              for d, emoji, desc in root_dirs:
                  f.write(f"ROOT|{d}|{emoji}|{desc}\n")
              # packages 分隔
              f.write("---\n")
              # packages 子目录
              for item in packages_lines:
                  if len(item) == 3:
                      emoji, label, not_last = item
                      f.write(f"PKG|{label}|{emoji}|{'/yn' if not_last else '/yn'}|NO_CHILDREN\n")
                  else:
                      emoji, label, not_last, children = item
                      f.write(f"PKG|{label}|{emoji}|{'/yn' if not_last else '/yn'}|HAS_CHILDREN\n")
                      for child_name, child_desc in children:
                          f.write(f"CHILD|{child_name}|{child_desc}\n")

          print("Structure generated successfully")
          PYTHON_SCRIPT

      - name: Generate README content
        run: |
          # 解析结构输出并生成 README 片段
          python3 << 'PYTHON_SCRIPT'
          import os

          with open('structure_output.txt', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          root_entries = []
          pkg_entries = []
          child_entries = {}
          current_pkg = None
          in_package_section = False

          for line in lines:
              line = line.strip()
              if line == '---':
                  in_package_section = True
                  continue
              parts = line.split('|')
              if parts[0] == 'ROOT':
                  _, name, emoji, desc = parts
                  root_entries.append((name, emoji, desc))
              elif parts[0] == 'PKG':
                  _, name, emoji, not_last, has_children = parts
                  pkg_entries.append((name, emoji, not_last == '/yn', has_children == 'HAS_CHILDREN'))
                  current_pkg = name
              elif parts[0] == 'CHILD':
                  _, name, desc = parts
                  if current_pkg not in child_entries:
                      child_entries[current_pkg] = []
                  child_entries[current_pkg].append((name, desc))

          # 生成新的项目结构
          output = []
          output.append("AI-Account-Toolkit/")

          # 根目录（固定顺序）
          fixed_order = ['CPAtools', 'grokRegister-cpa', 'GPT-team', 'team', 'team_all-in-one',
                         'codex-oauth-automation', 'codex-oauth-automation-extension', 'Extensions',
                         'freemail', 'openai_pool_orchestrator_v5', 'openai_pool_orchestrator-V6',
                         'ClashVerge_', 'gpt-outlook-register', 'Register_GPT_v0', 'mailhub',
                         'merge-mailtm-share', 'ob12api', 'chatgpt_register_duckmail', 'FreeSMS']

          name_to_info = {name: (emoji, desc) for name, emoji, desc in root_entries}
          for name in fixed_order:
              if name in name_to_info:
                  emoji, desc = name_to_info[name]
                  output.append(f"├── {emoji} {name}/                # {desc}")

          output.append("└── 📂 packages/                # 模块化子模块 (Submodules)")

          # packages 子目录
          pkg_order = ['openai', 'claude', 'gemini', 'codex', 'cursor', 'grok', 'nvidia', 'email', 'general']
          name_to_pkg = {name: (emoji, has_children) for name, emoji, not_last, has_children in pkg_entries}

          last_idx = len([n for n in pkg_order if n in name_to_pkg]) - 1
          for i, name in enumerate(pkg_order):
              if name not in name_to_pkg:
                  continue
              emoji, has_children = name_to_pkg[name]
              prefix = "    ├──" if i < last_idx else "    └──"
              output.append(f"{prefix} {emoji} {name}/              # 核心注册与 API 兼容层")

          # 破限工具
          if '破限工具' in [n for n, e, nl, hc in pkg_entries]:
              children = child_entries.get('破限工具', [])
          else:
              children = []

          if children:
              output.append("    │   └── 🛠️ 破限工具/             # 破限工具集合")
              for j, (child_name, child_desc) in enumerate(children):
                  prefix = "    │       ├──" if j < len(children) - 1 else "    │       └──"
                  output.append(f"{prefix} 📂 {child_name}/  # {child_desc}")

          # 写入临时文件
          with open('new_structure.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(output))

          print("README content generated")
          PYTHON_SCRIPT

      - name: Update README
        run: |
          awk '
            /^```text$/ && !started {
              started=1
              print
              while ((getline line < "new_structure.txt") > 0) {
                  print line
              }
              skip=1
              next
            }
            skip && /^```$/ { skip=0 }
            skip { next }
            { print }
          ' README.md > README.md.new && mv README.md.new README.md

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "No README changes needed"
          else
            git add README.md
            git commit -m "chore: auto-update README structure [skip ci]"
            git push
          fi
