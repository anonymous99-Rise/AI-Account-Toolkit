name: Update README Structure

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.gitmodules'
      - '*'
      - '*/'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate project structure
        id: structure
        run: |
          # 扫描所有子模块 (从 .gitmodules)
          declare -A submodule_map
          while IFS= read -r line; do
            if [[ "$line" =~ submodule\.\"(.*)\".*path=\"(.*)\" ]]; then
              path="${BASH_REMATCH[2]}"
              category=$(echo "$path" | cut -d'/' -f2)
              name=$(echo "$path" | cut -d'/' -f3-)
              submodule_map["$category"]+=" $name"
            fi
          done < <(git config --list --file .gitmodules)

          # 定义分类映射
          declare -A category_info
          category_info[openai]="🤖 openai"
          category_info[claude]="⚔️ claude"
          category_info[gemini]="💎 gemini"
          category_info[codex]="📜 codex"
          category_info[cursor]="🖱️ cursor"
          category_info[grok]="🐦 grok"
          category_info[nvidia]="🔱 nvidia"
          category_info[email]="📧 email"
          category_info[general]="🛠️ general"

          # 收集 packages 下的子模块
          packages_lines=""
          for category in openai claude gemini codex cursor grok nvidia email general; do
            info="${category_info[$category]}"
            emoji=$(echo "$info" | awk '{print $1}')
            label=$(echo "$info" | awk '{print $2}')
            if [[ -n "${submodule_map[$category]}" ]]; then
              packages_lines+="    ├── $emoji $label/\n"
            fi
          done

          # 扫描中文目录
          if [[ -d "packages/破限工具" ]]; then
            items=$(ls -d packages/破限工具/*/ 2>/dev/null | xargs -n1 basename | tr '\n' ' ')
            if [[ -n "$items" ]]; then
              packages_lines+="    └── 🛠️ 破限工具/             # 破限工具集合\n"
            fi
          fi

          # 扫描根目录非 git/子模块目录 (排除隐藏目录和特定文件)
          root_dirs=$(find . -maxdepth 1 -type d ! -name '.*' ! -name '.git' ! -name 'node_modules' ! -name 'packages' 2>/dev/null | sed 's|^\./||' | sort)

          echo "packages_lines<<EOF" >> $GITHUB_OUTPUT
          echo -e "$packages_lines" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "root_dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$root_dirs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README structure
        run: |
          # 生成 packages 结构行
          packages_str=""
          while IFS= read -r line; do
            packages_str+="$line\n"
          done <<< "${{ steps.structure.outputs.packages_lines }}"

          # 生成根目录行
          root_str=""
          while IFS= read -r dir; do
            case "$dir" in
              CPAtools)         desc="Codex 账号状态管理与自动清理" ;;
              grokRegister-cpa) desc="Grok 批量注册 → OAuth → CPA 入库 (GUI + CLI)" ;;
              GPT-team)         desc="ChatGPT Team 协议注册机 (CF 邮箱版)" ;;
              team)             desc="ChatGPT Team 纯协议注册机 (支持续签)" ;;
              team_all-in-one)  desc="Team 注册一站式管理后台" ;;
              codex-oauth-automation*) desc="Codex OAuth 自动化 Chrome 插件" ;;
              Extensions)       desc="浏览器自动化增强插件集" ;;
              freemail)         desc="临时邮箱服务端 (Cloudflare Workers)" ;;
              openai_pool*)     desc="OpenAI 账号池编排器 (旗舰版)" ;;
              ClashVerge_)      desc="代理负载均衡与轮询配置" ;;
              grok)             desc="Grok 独立工具" ;;
              packages)         desc="模块化子模块 (Submodules)" ;;
              *)                desc="" ;;
            esac
            # 截断描述到指定长度
            if [[ -n "$desc" ]]; then
              printf "├── 📂 %-24s # %s\n" "$dir" "$desc"
            fi
          done <<< "${{ steps.structure.outputs.root_dirs }}" > root_dirs.txt

          # awk 替换 README.md 中的项目结构部分
          awk '
            /^```text$/ && !started {
              started=1
              print
              print "AI-Account-Toolkit/"
              print "├── 📂 CPAtools/                # Codex 账号状态管理与自动清理"
              print "├── 📂 grokRegister-cpa/        # Grok 批量注册 → OAuth → CPA 入库 (GUI + CLI)"
              print "├── 📂 GPT-team/                # ChatGPT Team 协议注册机 (CF 邮箱版)"
              print "├── 📂 team/                    # ChatGPT Team 纯协议注册机 (支持续签)"
              print "├── 📂 team_all-in-one/         # Team 注册一站式管理后台"
              print "├── 📂 codex-oauth-automation/  # Codex OAuth 自动化 Chrome 插件"
              print "├── 📂 Extensions/              # 浏览器自动化增强插件集"
              print "├── 📂 freemail/                # 临时邮箱服务端 (Cloudflare Workers)"
              print "├── 📂 openai_pool_v6/          # OpenAI 账号池编排器 (旗舰版)"
              print "├── 📂 ClashVerge_/             # 代理负载均衡与轮询配置"
              print "└── 📂 packages/                # 模块化子模块 (Submodules)"
              print "    ├── 🤖 openai/              # 核心注册与 API 兼容层"
              print "    ├── ⚔️ claude/               # Key 轮换与负载均衡"
              print "    ├── 💎 gemini/               # 余额查询与 DO 代理"
              print "    ├── 📜 codex/                # 协议注册与 LB"
              print "    ├── 🖱️ cursor/               # 账号自动注册"
              print "    ├── 🐦 grok/                 # x.ai 批量注册与转换"
              print "    ├── 🔱 nvidia/               # NVIDIA 账号注册与 API"
              print "    ├── 📧 email/                # 临时邮箱与 OAuth 提码"
              print "    ├── 🛠️ general/              # 逆向聚合与通用工具"
              print "    └── 🛠️ 破限工具/             # 破限工具集合"
              skip=1
              next
            }
            skip && /^```$/ { skip=0 }
            skip { next }
            { print }
          ' README.md > README.md.new && mv README.md.new README.md

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "No README changes needed"
          else
            git add README.md
            git commit -m "chore: auto-update README structure [skip ci]"
            git push
          fi
