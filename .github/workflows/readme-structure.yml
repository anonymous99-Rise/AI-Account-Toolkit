name: Update README Structure

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate structure
        id: generate
        run: |
          # 从 .gitmodules 解析 submodule 路径和分类
          declare -A submodules
          while IFS='=' read -r key value; do
            case "$key" in
              *path*)
                current_path="$value"
                ;;
              *url*)
                # 从 path 提取分类和名称
                if [[ -n "$current_path" ]]; then
                  category=$(echo "$current_path" | cut -d'/' -f2)
                  name=$(echo "$current_path" | cut -d'/' -f3-)
                  submodules["$category"]+="  - $name\n"
                fi
                ;;
            esac
          done < <(git config --get-regexp submodule | tr ' ' '\n')

          # 生成新的 packages 结构
          packages_structure=""
          for category in openai claude gemini codex cursor grok nvidia email general; do
            case $category in
              openai)   emoji="🤖" label="openai" ;;
              claude)   emoji="⚔️"  label="claude" ;;
              gemini)   emoji="💎"  label="gemini" ;;
              codex)    emoji="📜"  label="codex" ;;
              cursor)   emoji="🖱️"  label="cursor" ;;
              grok)     emoji="🐦"  label="grok" ;;
              nvidia)   emoji="🔱"  label="nvidia" ;;
              email)    emoji="📧"  label="email" ;;
              general)  emoji="🛠️"  label="general" ;;
            esac
            if [[ -n "${submodules[$category]}" ]]; then
              packages_structure+="    ├── $emoji $label/\n"
            fi
          done

          # 处理中文目录（破限工具）
          if [[ -d "packages/破限工具" ]]; then
            items=$(ls -d packages/破限工具/*/ 2>/dev/null | xargs -n1 basename | sed 's/^/    │   /')
            packages_structure+="    ├── 🛠️ 破限工具/\n"
          fi

          echo "packages_structure=$packages_structure" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          # 用 awk 替换项目结构部分
          awk '
            /^```text$/ && !found {
              print
              print "AI-Account-Toolkit/"
              print "├── 📂 CPAtools/                # Codex 账号状态管理与自动清理"
              print "├── 📂 grokRegister-cpa/        # Grok 批量注册 → OAuth → CPA 入库 (GUI + CLI)"
              print "├── 📂 GPT-team/                # ChatGPT Team 协议注册机 (CF 邮箱版)"
              print "├── 📂 team/                    # ChatGPT Team 纯协议注册机 (支持续签)"
              print "├── 📂 team_all-in-one/         # Team 注册一站式管理后台"
              print "├── 📂 codex-oauth-automation/  # Codex OAuth 自动化 Chrome 插件"
              print "├── 📂 Extensions/              # 浏览器自动化增强插件集"
              print "├── 📂 freemail/                # 临时邮箱服务端 (Cloudflare Workers)"
              print "├── 📂 openai_pool_v6/          # OpenAI 账号池编排器 (旗舰版)"
              print "├── 📂 ClashVerge_/             # 代理负载均衡与轮询配置"
              print "└── 📂 packages/                # 模块化子模块 (Submodules)"
              print "    ├── 🤖 openai/              # 核心注册与 API 兼容层"
              print "    ├── ⚔️ claude/               # Key 轮换与负载均衡"
              print "    ├── 💎 gemini/               # 余额查询与 DO 代理"
              print "    ├── 📜 codex/                # 协议注册与 LB"
              print "    ├── 🖱️ cursor/               # 账号自动注册"
              print "    ├── 🐦 grok/                 # x.ai 批量注册与转换"
              print "    ├── 🔱 nvidia/               # NVIDIA 账号注册与 API"
              print "    ├── 📧 email/                # 临时邮箱与 OAuth 提码"
              print "    ├── 🛠️ general/              # 逆向聚合与通用工具"
              print "    └── 🛠️ 破限工具/             # 破限工具集合"

              # 跳过旧的 packages 结构直到遇到空的 --- 分隔行或下一个 ### 标题
              skip=0
              next
            }
            skip && /^---$/ { skip=0; next }
            skip && /^\#\#\# [📦🧭]/ { skip=0 }
            skip { next }
            { print }
          ' README.md > README.md.new && mv README.md.new README.md

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README"
          else
            git add README.md
            git commit -m "chore: auto-update README structure [skip ci]"
            git push
          fi
