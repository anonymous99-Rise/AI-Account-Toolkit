name: Version Bump & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (major/minor/patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest version
        id: get_version
        run: |
          # 版本基准 = max(最高已存在 tag, README 里的版本徽章)
          # 不用 git describe：它只看「从 HEAD 可达」的 tag，历史被重写后残留的孤儿 tag
          # 会让基准回退到旧版本，进而反复算出同一个已被占用的版本号，发行步骤被永久跳过。
          tag_version=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          badge_version=$(grep -oE 'Version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1 | sed 's/Version-//')

          if [ -z "$tag_version" ]; then
            tag_version="2.5.0"
          fi
          if [ -z "$badge_version" ]; then
            badge_version="0.0.0"
          fi

          base_version=$(printf '%s\n%s\n' "$tag_version" "$badge_version" | sort -V | tail -n1)
          latest_tag="v${base_version}"
          echo "Highest tag: $tag_version | README badge: $badge_version | Base: $latest_tag"

          if git rev-parse "$latest_tag" >/dev/null 2>&1; then
            echo "has_previous_tag=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous_tag=false" >> $GITHUB_OUTPUT
          fi
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

          # Extract version numbers
          IFS='.' read -r major minor patch <<< "$base_version"
          echo "Current version: $major.$minor.$patch"
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT
          echo "patch=$patch" >> $GITHUB_OUTPUT

      - name: Determine bump type
        id: bump_type
        run: |
          # Check commit message for bump type hints
          commit_msg=$(git log -1 --pretty=%B)
          bump_type="${{ github.event.inputs.version_bump }}"

          if [[ "$commit_msg" == *"feat:"* ]] || [[ "$commit_msg" == *"feat("* ]]; then
            if [[ "$commit_msg" == *"*"* ]]; then
              bump_type="major"
            else
              bump_type="minor"
            fi
          elif [[ "$commit_msg" == *"fix:"* ]] || [[ "$commit_msg" == *"fix("* ]] || [[ "$commit_msg" == *"chore:"* ]]; then
            bump_type="patch"
          elif [[ -z "$bump_type" ]] || [[ "$bump_type" == "patch" ]]; then
            bump_type="patch"
          fi

          echo "Bump type: $bump_type"
          echo "bump_type=$bump_type" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          major=${{ steps.get_version.outputs.major }}
          minor=${{ steps.get_version.outputs.minor }}
          patch=${{ steps.get_version.outputs.patch }}
          bump_type=${{ steps.bump_type.outputs.bump_type }}

          bump() {
            case "$bump_type" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              *)
                patch=$((patch + 1))
                ;;
            esac
          }

          bump
          # 版本名被任何 ref 占用就按同一语义继续抬高
          # （含历史重写遗留、当前分支引用不到的孤儿 tag，避免发行被永久跳过）
          while git rev-parse "v${major}.${minor}.${patch}" >/dev/null 2>&1; do
            echo "v${major}.${minor}.${patch} 已被占用，继续 bump"
            bump
          done

          new_version="v${major}.${minor}.${patch}"
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        run: |
          new_version=${{ steps.new_version.outputs.new_version }}
          if git rev-parse "$new_version" >/dev/null 2>&1; then
            echo "::error:: $new_version 仍被占用（并发发行？跳过本次）"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release $new_version does not exist"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Update version in README
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          new_version=${{ steps.new_version.outputs.new_version }}
          version_number=${new_version#v}

          # Update version badge in README
          sed -i "s|Version-.*-orange|Version-${version_number}-orange|" README.md

          # Update date in README and LICENSE
          current_date=$(date +%Y-%m-%d)
          sed -i "s|Updated:.*-|Updated: ${current_date} -|" README.md

          git add README.md

      - name: Update CHANGELOG
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          new_version=${{ steps.new_version.outputs.new_version }}
          current_date=$(date +%Y-%m-%d)

          # Get commit messages since last tag
          latest_tag=${{ steps.get_version.outputs.latest_tag }}
          has_previous_tag=${{ steps.get_version.outputs.has_previous_tag }}

          # 基准 tag 必须同时是 HEAD 的祖先，否则 git log range 会把整部历史都算进来
          if [[ "$has_previous_tag" == "true" ]] && git merge-base --is-ancestor "$latest_tag" HEAD 2>/dev/null; then
            commits=$(git log "${latest_tag}..HEAD" --pretty=format:"%s")
          else
            commits=$(git log --pretty=format:"%s" --max-count=30)
          fi

          # 写入文件再插入：原来的 `grep | while read` 在管道子 shell 里改变量，条目会丢
          {
            echo "## [${new_version#v}] - ${current_date}"
            echo ""
            echo "### ✨ Added"
            echo "$commits" | grep -i "^feat" | sed 's/^/- /' || true
            echo ""
            echo "### 🔧 Fixed"
            echo "$commits" | grep -i "^fix" | sed 's/^/- /' || true
            echo ""
          } > CHANGELOG.entry

          # Insert new entry after the header
          awk -v entryfile=CHANGELOG.entry '
            /^---$/ && !header_done {
              print
              print ""
              while ((getline line < entryfile) > 0) {
                print line
              }
              close(entryfile)
              header_done=1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          rm -f CHANGELOG.entry

          git add CHANGELOG.md

      - name: Commit version changes
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          new_version=${{ steps.new_version.outputs.new_version }}
          git commit -m "chore: bump version to ${new_version} [skip ci]" || echo "No changes to commit"

      - name: Create and push tag
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          new_version=${{ steps.new_version.outputs.new_version }}
          git tag -a "$new_version" -m "Release $new_version"
          # README 结构机器人可能刚推过提交：先 rebase 再分别推分支与 tag，避免被拒
          git pull --rebase origin main || true
          git push origin HEAD:main
          git push origin "$new_version"

      - name: Create GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_version.outputs.new_version }}
          name: ${{ steps.new_version.outputs.new_version }}
          body: |
            ## ${{ steps.new_version.outputs.new_version }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          new_version=${{ steps.new_version.outputs.new_version }}
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Version | ${{ steps.get_version.outputs.latest_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | $new_version |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | ${{ steps.bump_type.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.check_release.outputs.should_release == 'true' && 'Released' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
