name: Submodule Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨运行
  workflow_dispatch: # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule init

          # 清理 .git/config 里残留的幽灵 submodule（.gitmodules 里已不存在的条目）
          # 从 .gitmodules 提取所有合法 submodule 名称，然后从 .git/config 删掉不匹配的那些
          valid_names=()
          while IFS= read -r path_key; do
            sm_name="${path_key#submodule.}"
            sm_name="${sm_name%.path}"
            valid_names+=("$sm_name")
          done < <(git config --file .gitmodules --name-only --get-regexp '\.path$')

          while IFS= read -r cfg_key; do
            sm_name="${cfg_key%.url}"
            sm_name="${sm_name#submodule.}"
            is_valid=false
            for valid in "${valid_names[@]}"; do
              if [ "$sm_name" = "$valid" ]; then
                is_valid=true
                break
              fi
            done
            if [ "$is_valid" = false ]; then
              echo "Removing orphaned submodule config: $sm_name"
              git config --remove-section "submodule.$sm_name" 2>/dev/null || true
            fi
          done < <(git config --name-only --get-regexp '^submodule\.')

          # 重新获取清理后的 submodule 列表
          sm_paths=()
          while IFS= read -r path_key; do
            sm_paths+=("$(git config --file .gitmodules --get "$path_key")")
          done < <(git config --file .gitmodules --name-only --get-regexp '\.path$')

          echo "### Submodule Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "| Submodule | Status | Action |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          for sm in "${sm_paths[@]}"; do
            echo "--------------------------------------------------"
            echo "Checking submodule: $sm"
            URL=$(git config --file .gitmodules --get "submodule.${sm}.url")

            if [ -z "$URL" ]; then
              echo "::warning:: Submodule $sm has no URL in .gitmodules — skipping (possibly orphaned)."
              echo "| $sm | ⚠️ ORPHAN | No URL in .gitmodules |" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            if curl --output /dev/null --silent --head --fail -L "$URL"; then
              echo "Upstream $URL is healthy. Updating to latest commit..."
              if git submodule update --init --recursive --remote "$sm"; then
                echo "Successfully updated $sm"
                echo "| $sm | ✅ OK | Updated to latest |" >> $GITHUB_STEP_SUMMARY
              else
                echo "::warning:: Failed to update $sm (check branch/ref). Skipping."
                echo "| $sm | ⚠️ WARN | Update failed |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "::error:: Submodule $sm upstream ($URL) is 404 or unreachable!"
              echo "Skipping $sm to avoid build failure. Manual intervention required (fork or flatten)."
              echo "| $sm | ❌ 404 | **Action required** |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync submodules [skip ci]"
            git push
          fi
